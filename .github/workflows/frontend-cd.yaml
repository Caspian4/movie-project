name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

  build:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
  
    needs:
      - build
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
  
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
  
      - name: Build Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            --tag frontend:latest .
  
      - name: Tag Docker image
        run: |
          docker tag frontend:latest \
            ${{ steps.login-ecr.outputs.registry }}/frontend:latest
  
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/frontend:latest
  
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name cluster \
            --region ${{ secrets.AWS_REGION }}
  
      - name: Check EKS
        run: |
          aws eks describe-cluster \
            --name cluster \
            --region ${{ secrets.AWS_REGION }} \
            --query 'cluster.computeConfig'
  
      - name: Check subnets
        run: |
          aws eks describe-cluster \
            --name cluster \
            --region ${{ secrets.AWS_REGION }} \
            --query 'cluster.resourcesVpcConfig.subnetIds'
      - name: Find frontend node AZ and subnet
        run: |
          NODE=$(kubectl get pod -l app=frontend \
            -o jsonpath='{.items[0].spec.nodeName}')
      
          echo "Frontend node: $NODE"
      
          NODE_IP=$(kubectl get node "$NODE" \
            -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
      
          echo "Node IP: $NODE_IP"
      
          aws ec2 describe-network-interfaces \
            --filters "Name=private-ip-address,Values=$NODE_IP" \
            --region ${{ secrets.AWS_REGION }} \
            --query 'NetworkInterfaces[].{SubnetId:SubnetId,AZ:AvailabilityZone,PrivateIP:PrivateIpAddress}' \
            --output table
      - name: Deploy to EKS
        working-directory: starter/frontend/k8s
        run: kubectl apply -k .
  
      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ steps.login-ecr.outputs.registry }}/frontend:latest
  
      - name: Wait for frontend deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=5m
  
      - name: Check frontend pods
        run: |
          kubectl get pods -l app=frontend -o wide
  
      - name: Check frontend service
        run: |
          kubectl get svc frontend -o wide
  
      - name: Describe frontend service
        run: |
          kubectl describe svc frontend
  
      - name: Check frontend service YAML
        run: |
          kubectl get svc frontend -o yaml
  
      - name: Check frontend endpoints
        run: |
          kubectl get endpoints frontend -o wide
  
      - name: Check frontend endpointslices
        run: |
          kubectl get endpointslices \
            -l kubernetes.io/service-name=frontend \
            -o wide
  
      - name: Check nodes
        run: |
          kubectl get nodes -o wide
  
      - name: Check frontend NLB
        run: |
          aws elbv2 describe-load-balancers \
            --region ${{ secrets.AWS_REGION }} \
            --query 'LoadBalancers[?contains(DNSName, `k8s-default-frontend`)].{Name:LoadBalancerName,DNS:DNSName,State:State.Code,Scheme:Scheme,AZs:AvailabilityZones[*].ZoneName}'
  
      - name: Check frontend target groups
        run: |
          aws elbv2 describe-target-groups \
            --region ${{ secrets.AWS_REGION }} \
            --query 'TargetGroups[?contains(TargetGroupName, `k8s-default-frontend`)].{Name:TargetGroupName,ARN:TargetGroupArn,Port:Port,Protocol:Protocol}'
  
      - name: Get frontend NLB URL
        run: |
          NLB_URL=$(kubectl get svc frontend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
  
          echo "Frontend NLB: $NLB_URL"
  
          if [ -z "$NLB_URL" ]; then
            echo "NLB hostname is still pending."
            exit 1
          fi
  
          echo "FRONTEND_URL=http://$NLB_URL" >> "$GITHUB_ENV"
      - name: Check frontend target health
        run: |
          TARGET_ARN=$(aws elbv2 describe-target-groups \
            --region ${{ secrets.AWS_REGION }} \
            --query 'TargetGroups[?contains(TargetGroupName, `k8s-default-frontend`)].TargetGroupArn' \
            --output text)
      
          echo "Target Group ARN: $TARGET_ARN"
      
          aws elbv2 describe-target-health \
            --region ${{ secrets.AWS_REGION }} \
            --target-group-arn "$TARGET_ARN"

      - name: Check frontend NLB listeners
        run: |
          NLB_ARN=$(aws elbv2 describe-load-balancers \
            --region ${{ secrets.AWS_REGION }} \
            --query 'LoadBalancers[?contains(LoadBalancerName, `k8s-default-frontend`)].LoadBalancerArn' \
            --output text)
      
          echo "NLB ARN: $NLB_ARN"
      
          aws elbv2 describe-listeners \
            --region ${{ secrets.AWS_REGION }} \
            --load-balancer-arn "$NLB_ARN"
            
      - name: Test frontend from GitHub runner
        run: |
          echo "Testing: $FRONTEND_URL"
  
          curl -v \
            --connect-timeout 10 \
            --max-time 30 \
            "$FRONTEND_URL"
  
      - name: Final frontend status
        run: |
          kubectl get deployment frontend
          kubectl get pods -l app=frontend
          kubectl get svc frontend
          kubectl get endpoints frontend
